name: Probe APIs

# Checks what the backends used by the app return from a GitHub runner.
# Results are printed as annotations on the run page.
on:
  workflow_dispatch:
  push:
    paths: ['.github/probe/**']

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe embed page
        run: python3 .github/probe/watch.py
