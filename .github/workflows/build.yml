name: Build IPA

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Xcode 27 + iOS 27 SDK (Apple Silicon runner)
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          pod --version

      - name: Install CocoaPods dependencies
        run: pod install

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace ICO-Visualizer.xcworkspace \
            -scheme ICO-visualizer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | tee build.log | (xcpretty 2>/dev/null || cat)

      - name: Package .ipa
        run: |
          APP=$(find build/Build/Products -maxdepth 2 -name "*.app" -type d | head -n 1)
          echo "Found app: $APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry ICO-Visualizer.ipa Payload
          ls -lh ICO-Visualizer.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ICO-Visualizer-ipa
          path: ICO-Visualizer.ipa

      - name: Surface compiler errors as annotations
        if: failure()
        run: |
          grep -E "error:|fatal error|Command .* failed|BUILD FAILED" build.log | sed 's#/Users/runner/work/[^/]*/[^/]*/##' | awk '!seen[$0]++' | head -n 9 | while IFS= read -r line; do
            echo "::error::${line:0:900}"
          done

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ICO-Visualizer.ipa
